name: Prepare draft release

on:
  push:
    tags: ['*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release -- --tag "$RELEASE_TAG"
      - name: Attest plugin assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/releases/${{ github.ref_name }}/main.js
            artifacts/releases/${{ github.ref_name }}/manifest.json
            artifacts/releases/${{ github.ref_name }}/styles.css
      - name: Create draft with plugin attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "artifacts/releases/$RELEASE_TAG/main.js" \
            "artifacts/releases/$RELEASE_TAG/manifest.json" \
            "artifacts/releases/$RELEASE_TAG/styles.css" \
            --draft --verify-tag \
            --title "Vault Codex $RELEASE_TAG" \
            --notes-file "artifacts/releases/$RELEASE_TAG/RELEASE_NOTES.md"
